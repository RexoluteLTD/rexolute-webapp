server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /home { return 301 /$is_args$args; }
    location = /home/ { return 301 /$is_args$args; }
    location ~ ^/(about-us|contact-us|privacy|policy|terms-condition)/$ {
        return 301 /$1$is_args$args;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Traefik owns the API route; never serve an HTML fallback for API requests.
    location /api/ { return 404; }
    # The landing build emits route-specific HTML. Unknown URLs retain HTTP 404.
    location / { try_files $uri $uri.html $uri/ =404; }
}
