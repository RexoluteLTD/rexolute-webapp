server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /home { return 301 /$is_args$args; }
    location = /home/ { return 301 /$is_args$args; }
    location ~ ^/(about-us|blog|contact-us|privacy|policy|terms-condition)/$ {
        return 301 /$1$is_args$args;
    }
    location = /blog-article.html { internal; add_header Cache-Control "no-store"; }
    location ~* "^(?<blog_article>/blog/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12})/$" {
        return 301 $blog_article$is_args$args;
    }
    location ~* "^/blog/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$" {
        try_files /blog-article.html =404;
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Traefik owns the API route; never serve an HTML fallback for API requests.
    location /v1/ { return 404; }
    location /api/v1/ { return 404; }
    # The landing build emits route-specific HTML. Unknown URLs retain HTTP 404.
    location / { try_files $uri $uri.html $uri/ =404; }
}
