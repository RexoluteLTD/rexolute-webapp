server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Traefik routes /api/v1/ to the backend before Nginx. Reject API requests
    # reaching this container so misconfigured routing never returns SPA HTML.
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
