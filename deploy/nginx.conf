server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # API calls must reach the configured backend, never the SPA fallback.
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
