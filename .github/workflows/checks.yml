name: Frontend checks
on:
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      apps:
        type: string
        required: true
      build:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('yarn.lock') }}-
      - name: Select apps
        id: affected
        env:
          REQUESTED_APPS: ${{ inputs.apps }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$REQUESTED_APPS" ]; then
            echo "apps=$REQUESTED_APPS" >> "$GITHUB_OUTPUT"
          else
            node scripts/affected-apps.mjs "$BASE_SHA"
          fi
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # Deployment builds the selected apps inside Docker with environment-specific values.
      - name: Build affected apps
        if: inputs.apps == '' || inputs.build == true
        env:
          APPS: ${{ steps.affected.outputs.apps }}
        run: node scripts/build-apps.mjs "$APPS"
  images:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.checks.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      TARGET: ${{ github.base_ref == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure reusable pull-request image
        id: config
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          set -euo pipefail
          : "${BASE_DOMAIN:?Set BASE_DOMAIN in the GitHub environment}"
          [[ "$BASE_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$ ]]
          [[ "$TARGET" == production || "$TARGET" == development ]]
          [[ "$APP" == landing || "$APP" == admin || "$APP" == client ]]
          landing_domain="$BASE_DOMAIN"
          admin_domain="admin.$BASE_DOMAIN"
          client_domain="app.$BASE_DOMAIN"
          if [ "$TARGET" = development ]; then
            landing_domain="landing-dev.$BASE_DOMAIN"
            admin_domain="admin-dev.$BASE_DOMAIN"
            client_domain="app-dev.$BASE_DOMAIN"
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "landing_domain=$landing_domain" >> "$GITHUB_OUTPUT"
          echo "admin_domain=$admin_domain" >> "$GITHUB_OUTPUT"
          echo "client_domain=$client_domain" >> "$GITHUB_OUTPUT"
          echo "tag=build-$TARGET-$tree" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/$APP" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish reusable app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.config.outputs.image }}:${{ steps.config.outputs.tag }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_SITE_INDEXABLE=${{ env.TARGET == 'production' }}
            VITE_LANDING_URL=https://${{ steps.config.outputs.landing_domain }}
            VITE_ADMIN_URL=https://${{ steps.config.outputs.admin_domain }}
            VITE_CLIENT_URL=https://${{ steps.config.outputs.client_domain }}
          cache-from: type=gha,scope=${{ env.TARGET }}-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET }}-${{ matrix.app }}
