name: Frontend pull request
on:
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  images:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.checks.outputs.apps != '[]' && vars.BASE_DOMAIN != ''
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.checks.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      TARGET: ${{ github.base_ref == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure reusable pull-request image
        id: config
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: bash deploy/frontend-config.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish reusable app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.config.outputs.image }}:${{ steps.config.outputs.tag }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_SITE_INDEXABLE=${{ steps.config.outputs.indexable }}
            VITE_LANDING_URL=https://${{ steps.config.outputs.landing_domain }}
            VITE_ADMIN_URL=https://${{ steps.config.outputs.admin_domain }}
            VITE_CLIENT_URL=https://${{ steps.config.outputs.client_domain }}
          cache-from: type=gha,scope=${{ env.TARGET }}-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET }}-${{ matrix.app }}
