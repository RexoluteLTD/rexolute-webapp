name: Deploy frontend
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild all apps (also use after changing environment variables)
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
# Do not interrupt a remote deployment. Production and development have separate queues.
concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      changed: ${{ steps.affected.outputs.changed }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo 'environment=production' >> "$GITHUB_OUTPUT"
          else
            echo 'environment=development' >> "$GITHUB_OUTPUT"
          fi
      - name: Find last successful release on this branch
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail
          base=''
          if [ "$FORCE_ALL" != true ]; then
            base=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty')
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select affected apps and dependent consumers
        id: affected
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: node scripts/affected-apps.mjs "$BASE_SHA"
  checks:
    needs: plan
    uses: ./.github/workflows/checks.yml
    with:
      apps: ${{ needs.plan.outputs.apps }}
      build: false
  images:
    needs: [plan, checks]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure public build values
        id: config
        env:
          TARGET: ${{ needs.plan.outputs.environment }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          set -euo pipefail
          : "${BASE_DOMAIN:?Set BASE_DOMAIN in the GitHub environment}"
          [[ "$BASE_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$ ]]
          landing_domain="$BASE_DOMAIN"
          admin_domain="admin.$BASE_DOMAIN"
          client_domain="app.$BASE_DOMAIN"
          if [ "$TARGET" = development ]; then
            landing_domain="landing-dev.$BASE_DOMAIN"
            admin_domain="admin-dev.$BASE_DOMAIN"
            client_domain="app-dev.$BASE_DOMAIN"
          fi
          echo "landing_domain=$landing_domain" >> "$GITHUB_OUTPUT"
          echo "admin_domain=$admin_domain" >> "$GITHUB_OUTPUT"
          echo "client_domain=$client_domain" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${APP}" >> "$GITHUB_OUTPUT"
        # APP is validated by the affected-app selector, not a freeform input.
        # All VITE values below are public configuration.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish selected app
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.config.outputs.image }}:${{ needs.plan.outputs.environment }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_SITE_INDEXABLE=${{ needs.plan.outputs.environment == 'production' }}
            VITE_LANDING_URL=https://${{ steps.config.outputs.landing_domain }}
            VITE_ADMIN_URL=https://${{ steps.config.outputs.admin_domain }}
            VITE_CLIENT_URL=https://${{ steps.config.outputs.client_domain }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.environment }}-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.environment }}-${{ matrix.app }}
      - name: Record immutable release image
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          APP: ${{ matrix.app }}
        run: |
          mkdir -p images
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "images/$APP.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: images/*.txt
          retention-days: 30
    env:
      APP: ${{ matrix.app }}
  deploy:
    needs: [plan, images]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    timeout-minutes: 20
    env:
      APP_DIR: frontend-${{ matrix.app }}${{ needs.plan.outputs.environment == 'development' && '-dev' || '' }}
      APP: ${{ matrix.app }}
      DEPLOY_ENVIRONMENT: ${{ needs.plan.outputs.environment }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: images
      - name: Reject superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced; the next workflow will deploy the accumulated changes.' >&2
            exit 1
          fi
      - name: Configure authenticated SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?Configure VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Configure independently verified VPS_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$VPS_SSH_PORT >= 1 && 10#$VPS_SSH_PORT <= 65535 ))
          install -d -m 700 "$RUNNER_TEMP/rexolute-ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/rexolute-ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/rexolute-ssh/known_hosts"
      - name: Upload release and deploy
        timeout-minutes: 15
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK || 'localhost' }}
          REGISTRY_USER: ${{ vars.GHCR_USER || github.repository_owner }}
          REGISTRY_PASSWORD: ${{ secrets.CR_PAT }}
        run: |
          set -euo pipefail
          : "${REGISTRY_PASSWORD:?Configure CR_PAT for registry pulls}"
          [[ "$APP" == landing || "$APP" == admin || "$APP" == client ]]
          [[ "$DEPLOY_ENVIRONMENT" == production || "$DEPLOY_ENVIRONMENT" == development ]]
          [[ "$RELEASE_ID" =~ ^[0-9]+-[0-9]+$ ]]
          expected_dir="frontend-$APP"
          if [[ "$DEPLOY_ENVIRONMENT" == development ]]; then expected_dir+="-dev"; fi
          [[ "$APP_DIR" == "$expected_dir" ]]
          ssh_options=(-i "$RUNNER_TEMP/rexolute-ssh/deploy_key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/rexolute-ssh/known_hosts"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          destination="$VPS_USER@$VPS_HOST"
          release_dir="/var/apps/$APP_DIR/releases/$RELEASE_ID"
          tar -czf "$RUNNER_TEMP/release.tgz" deploy/compose.yml deploy/release.sh "images/$APP.txt"
          ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$destination" "umask 077; mkdir -p '$release_dir'"
          scp "${ssh_options[@]}" -P "$VPS_SSH_PORT" "$RUNNER_TEMP/release.tgz" "$destination:$release_dir/"
          # Stream quoted assignments over SSH; never write the pull token to a release file.
          # The remote shell is explicitly Bash so printf %q quoting is interpreted correctly.
          {
            printf 'set -euo pipefail\numask 077\n'
            printf 'cd %q\ntar -xzf release.tgz\n' "$release_dir"
            printf 'export TARGET=%q APP=%q RELEASE_ID=%q BASE_DOMAIN=%q TRAEFIK_NETWORK=%q REGISTRY_USER=%q REGISTRY_PASSWORD=%q\n' \
              "$DEPLOY_ENVIRONMENT" "$APP" "$RELEASE_ID" "$BASE_DOMAIN" "$TRAEFIK_NETWORK" "$REGISTRY_USER" "$REGISTRY_PASSWORD"
            printf 'exec bash %q\n' "$release_dir/deploy/release.sh"
          } | ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$destination" 'bash --noprofile --norc -se'
      - name: Remove runner SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rexolute-ssh" "$RUNNER_TEMP/release.tgz"
